      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("moxie.theme");
        } catch (e) {}
        var dark =
          stored === "dark" ||
          ((!stored) &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.backgroundColor = dark
          ? "#1d1e22"
          : "#ffffff";

## 2. 文本格式与行内元素 (Inline Formats)

Markdown 支持多种丰富的行内样式修饰：
- **粗体强调 (Bold)**：\`**重要提示**\` 渲染为 **重要提示**。
- *斜体强调 (Italic)*：\`*次要说明*\` 渲染为 *次要说明*。
- ***粗斜体 (Bold Italic)***：\`***重点着重***\` 渲染为 ***重点着重***。
- ~~删除线 (Strikethrough)~~：\`~~已废弃方案~~\` 渲染为 ~~已废弃方案~~。
- ==高亮标记 (Highlight Mark)==：\`==核心关键词==\` 渲染为 ==核心关键词==（醒目柔和荧光标记）。
- 行内代码 (Inline Code)：\`const moxie = new Editor();\` 渲染为 \`const moxie = new Editor();\`。

\`\`\`typescript
// Moxie 核心编辑器配置规范示例
import { EditorState } from "@codemirror/state";
import { EditorView } from "@codemirror/view";
import { CONTENT_LINE_HEIGHT, MD_MARGIN } from "./typography";

export interface EditorConfig {
  fontSizePt: number;
  lineHeight: number;
  wordWrap: boolean;
  theme: "light" | "dark";
}

export function createMoxieEditor(config: EditorConfig): EditorView {
  const state = EditorState.create({
    doc: "# 欢迎使用 Moxie 编辑器\\n\\n开始书写您的精彩灵感...",
    extensions: [
      EditorView.lineWrapping,
      EditorView.theme({
        ".cm-scroller": {
          lineHeight: \`\${config.lineHeight}em\`,
        },
      }),
    ],
  });

  return new EditorView({ state });
}

## 7. 数学公式 (LaTeX Math)

### 7.1 行内公式 (Inline Math)
欧拉恒等式通常被称为数学中最美妙的公式：$e^{i\\pi} + 1 = 0$。质能方程为 $E = mc^2$。

### 7.2 块级公式 (Block Math)
高斯正态分布积分公式：
$$\\int_{-\\infty}^{+\\infty} e^{-x^2} \\, dx = \\sqrt{\\pi}$$

以及傅里叶变换公式：
$$\\hat{f}(\\xi) = \\int_{-\\infty}^{\\infty} f(x) e^{-2\\pi i x \\xi} \\, dx$$
