<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moxie</title>
    <script>
      // 样式加载前同步恢复主题，避免深色模式白闪；键与 src/state/theme.ts 约定一致
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("moxie.theme");
        } catch (e) {}
        var dark =
          stored === "dark" ||
          ((!stored) &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.backgroundColor = dark
          ? "#1d1e22"
          : "#ffffff";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // 浏览器预览 mock：仅在 dev 且不在 Tauri webview 内生效（生产构建被摇树），
      // 用于无 Tauri 环境时渲染真实 UI 做视觉验证。
      if (import.meta.env.DEV && !window.__TAURI_INTERNALS__) {
        let cbId = 0;
        const listeners = new Map();
        window.__TAURI_INTERNALS__ = {
          transformCallback(callback) {
            const id = ++cbId;
            listeners.set(id, callback);
            return id;
          },
          transformers: {
            unregisterListener() {},
            registerListener() {},
          },
          metadata: {
            currentWindow: { label: "main" },
            currentWebview: { label: "main", windowLabel: "main" },
          },
          plugins: {},
          invoke(cmd, args) {
            const empty = () => Promise.resolve(null);
            // ?doc=1 时经真实链路（openPathAction）打开 UI 重构对照样张，供截图比对
            const launchArgs = () => {
              const doc = new URLSearchParams(location.search).get("doc");
              return doc ? ["F:\\Moxie\\work\\ui-baseline\\对照样张.md"] : [];
            };
            const table = {
              launch_args: launchArgs,
              read_text_file: (a) => {
                if (a && a.path.endsWith("对照样张.md")) {
                  return fetch(
                    "/work/ui-baseline/%E5%AF%B9%E7%85%A7%E6%A0%B7%E5%BC%A0.md"
                  ).then((res) =>
                    res.text().then((text) => ({
                      text,
                      encoding: "utf-8",
                      lineEnding: "lf",
                    }))
                  );
                }
                return Promise.reject(new Error("mock: no content"));
              },
              recent_list: () => [],
              recovery_load: empty,
              recovery_read_marker: empty,
              settings_save: empty,
              sidebar_save: empty,
              workspace_save: empty,
              fs_watch: empty,
              timeline_save: empty,
              recovery_cleanup: empty,
              recovery_finish_cleanly: empty,
              recovery_write_marker: empty,
              recovery_save_doc: empty,
              recovery_remove_doc: empty,
              recent_add: empty,
              recent_remove: empty,
              recent_replace: empty,
              recent_clear: empty,
              get_file_revision: empty,
            };
            return table[cmd]
              ? table[cmd](args)
              : Promise.reject(new Error(`mock: unhandled command ${cmd}`));
          },
        };
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
